name: Deploy Site
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-elixir:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
      with:
        mise_toml: |-
          [settings]
          enable_tools = ["elixir", "erlang"]
    - name: Elixir Deps cache
      id: elixir-deps-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |-
          deps
          _build
          .mix/archives/
        key: elixir-build-${{hashFiles('mise.lock')}}-${{hashFiles('mix.lock')}}
        restore-keys: elixir-build-${{hashFiles('mise.lock')}}-
    - name: Install Elixir Dependencies
      run: |-
        mix local.hex --force --if-missing
        mix deps.get
    - name: Build Tableau
      env:
        MIX_ENV: prod
      run: mix tableau.build
    - name: site-elixir
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: site-elixir
        path: ./_site
        if-no-files-found: error
  build-assets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
      with:
        mise_toml: |-
          [settings]
          enable_tools = ["bun"]
    - name: Bun Deps Cache
      id: bun-deps-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.bun/install/cache
        key: bun-cache-${{hashFiles('mise.lock')}}-${{hashFiles('assets/bun.lock')}}
        restore-keys: bun-cache-${{hashFiles('mise.lock')}}-
    - name: Install JS dependencies
      working-directory: assets/
      run: bun install --frozen-lockfile
    - name: Build Static Assets
      env:
        NODE_ENV: production
      working-directory: assets/
      run: bun run build
    - name: site-static
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: site-static
        path: ./_site
        if-no-files-found: error
  deploy-netlify:
    needs:
    - build-elixir
    - build-assets
    runs-on: ubuntu-latest
    environment:
      name: netlfiy-prod
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
        sparse-checkout: |-
          .mise.toml
          mise.lock
        sparse-checkout-cone-mode: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        path: _site/
        pattern: site-*
        merge-multiple: true
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
      with:
        mise_toml: |-
          [settings]
          enable_tools = ["github:wilsonzlin/minify-html"]
    - name: Minify HTML
      run: |-
        shopt -s globstar
        minify-html --minify-css --minify-js _site/**/*.html
    - name: Deploy to Netlify
      env:
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      uses: netlify/actions/cli@3185065f4ab2f6df6f2ef41ee013626e1c02a426
      with:
        args: deploy --dir=_site --prod -m "https://github.com/paradox460/pdx.su/commit/${{ github.sha }}"
